[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ctxc"
version = "0.0.1"
description = "A minimal filesystem-to-context compiler."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jeremylimqe" }]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
ctxc = "ctxc.cli:main"

[project.urls]
Repository = "https://github.com/jeremylimqe/ctxc"
Issues = "https://github.com/jeremylimqe/ctxc/issues"